name: CI

on:
  push:
    branches: [ "main", "release/**" ]
  pull_request:
    branches: [ "main", "release/**" ]

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.x'
          cache: 'npm'
      - run: npm ci
      - run: npm run build --if-present
        working-directory: api
      - run: npm run check
        working-directory: api
      - run: npm run test:run
        working-directory: api

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.x'
          cache: 'npm'
      - run: npm ci
      - run: npm run build --if-present
        working-directory: mobile
      - run: npm run lint
        working-directory: mobile
      - run: npm run test
        working-directory: mobile
  
  icon-wrapping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.x'
          cache: 'npm'
      - run: npm ci
      - run: node scripts/check-lucide-icon-wrapping.js
        working-directory: mobile

  orval-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.x'
          cache: 'npm'
      - run: npm ci
      - run : npm run dev &
        working-directory: api
        env:
          BETTER_AUTH_SECRET: dummy-secret
          BETTER_AUTH_URL: http://localhost:8787
      - uses: ./.github/actions/wait-for-api/
      - run: npm run generate
        working-directory: mobile
      - run: git diff --exit-code -- mobile/src/external/api.ts
      - if: always()
        run: pkill -f "wrangler dev" || true

  # --- CD: main への push（＝本番リリース点）でのみ実行 ---
  # 上記CIジョブ（api/mobile/icon-wrapping/orval-drift）が全て通った場合だけ走らせ、
  # api と mobile を同じ main コミットから同時にトリガーすることで
  # 片方だけ古い「バージョンずれ」を構造的に作れないようにする。
  deploy-api:
    needs: [ api, mobile, icon-wrapping, orval-drift ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.x'
          cache: 'npm'
      - run: npm ci
      - run: npm run deploy
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy-mobile:
    needs: [ deploy-api ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.x'
          cache: 'npm'
      - name: Setup EAS
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # 9.0.0
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      # iOSビルド完了後、EASのクラウド側でそのまま TestFlight へ自動提出する。
      # --no-wait でエンキューのみ待ち、20分級のビルドで Actions 時間を消費しない。
      - run: eas build --platform ios --profile production --non-interactive --auto-submit --no-wait
        working-directory: mobile
