name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.x'
          cache: 'npm'
      - run: npm ci
      - run: npm run build --if-present
        working-directory: api
      - run: npm run check
        working-directory: api
      - run: npm run test:run
        working-directory: api

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.x'
          cache: 'npm'
      - run: npm ci
      - run: npm run build --if-present
        working-directory: mobile
      - run: npm run lint
        working-directory: mobile
      - run: npm run test
        working-directory: mobile
  
  icon-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.x'
          cache: 'npm'
      - run: npm ci
      - run: node scripts/check-lucide-icon-wrapping.js
        working-directory: mobile

  orval-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.x'
          cache: 'npm'
      - run: npm ci
      - run : npm run dev &
        working-directory: api
        env:
          BETTER_AUTH_SECRET: dummy-secret
          BETTER_AUTH_URL: http://localhost:8787
      - uses: ./.github/actions/wait-for-api/
      - run: npm run generate
        working-directory: mobile
      - run: git diff --exit-code -- mobile/src/external/api.ts
      - if: always()
        run: pkill -f "wrangler dev" || true
