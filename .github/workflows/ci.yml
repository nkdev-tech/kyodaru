name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25.x'
      - run: npm ci
      - run: npm run build --if-present
        working-directory: api
      - run: npm run check
        working-directory: api
      - run: npm run test:run
        working-directory: api

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25.x'
      - run: npm ci
      - run: npm run build --if-present
        working-directory: mobile
      - run: npm run lint
        working-directory: mobile
      - run: npm run test
        working-directory: mobile
